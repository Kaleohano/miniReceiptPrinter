<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#c9edf0" />
    <meta name="description" content="把一张照片打印成一份属于今天的电子小票。" />
    <title>Today's Receipt</title>
    <link rel="stylesheet" href="styles.css?v=20260814-1" />
  </head>
  <body>
    <div class="grain" aria-hidden="true"></div>
    <main class="app-shell">
      <header class="topbar">
        <button class="wordmark" id="homeButton" type="button" aria-label="返回首页">
          <span class="wordmark-mark">T</span>
          <span>Today's Receipt</span>
        </button>
        <div class="top-actions">
          <span class="device-label" id="deviceLabel">正在识别设备</span>
          <button class="icon-button" id="soundButton" type="button" aria-label="关闭声音" title="关闭声音">
            <span aria-hidden="true">♪</span>
          </button>
        </div>
      </header>

      <section class="stage" id="stage" aria-live="polite">
        <div class="intro-copy" id="introCopy">
          <p>把一张照片，打印成今天的纪念。</p>
        </div>

        <section class="device-scene upload-scene" id="uploadScene">
          <div class="typewriter-model hero-typewriter" aria-hidden="true">
            <div class="model-paper"><span>TODAY'S RECEIPT</span><i></i><i></i><i></i><i></i></div>
            <span class="paper-guide guide-left"></span><span class="paper-guide guide-right"></span>
            <span class="return-lever"></span>
            <div class="model-carriage"><span class="carriage-knob"></span><span class="carriage-rail"></span><span class="carriage-knob"></span></div>
            <div class="ribbon-deck"><span class="ribbon-spool"><i></i></span><span class="type-guide"></span><span class="ribbon-spool"><i></i></span></div>
            <div class="model-shell"><span class="shell-highlight"></span><span class="keywell"></span><div class="model-brand">TODAY <small>portable no. 1</small></div><div class="model-keyboard"></div><span class="model-spacebar"></span><i class="machine-foot foot-left"></i><i class="machine-foot foot-right"></i></div>
          </div>
          <button class="primary-button upload-only-button" id="uploadButton" type="button" aria-label="上传照片" title="上传照片">
            <span class="upload-icon" aria-hidden="true">↑</span>
            <span class="sr-only">上传照片</span>
          </button>
          <p class="support-text">支持 JPG、PNG、WEBP，也可以直接拖到这里</p>
        </section>

        <section class="preview-panel" id="previewPanel" hidden>
          <div class="preview-photo-wrap">
            <img id="previewImage" alt="待制作的小票照片预览" />
            <span class="preview-tape" aria-hidden="true"></span>
            <p class="subject-status" id="subjectStatus" role="status" aria-live="polite">正在识别照片主体</p>
          </div>
          <div class="preview-copy">
            <p class="eyebrow">照片已就位</p>
            <h2>要把这一刻收进小票吗？</h2>
            <p id="photoMeta">正在读取照片信息</p>
            <div class="button-row">
              <button class="secondary-button" id="chooseAgainButton" type="button">重新选择</button>
              <button class="primary-button" id="makeReceiptButton" type="button">开始打印</button>
            </div>
          </div>
        </section>

        <section class="printing-scene" id="printingScene" hidden>
          <div class="typewriter typewriter-model" aria-hidden="true">
            <div class="model-paper receipt-in-typewriter" id="printingPaper">
              <div class="typed-receipt" id="typedReceipt">
                <div class="receipt-head">
                  <span>TODAY'S RECEIPT</span>
                  <small id="receiptNumber">NO. 000000</small>
                </div>
                <div class="receipt-photo"><img id="receiptPhoto" alt="电子小票照片贴纸" /></div>
                <dl class="receipt-info">
                  <div><dt>日期</dt><dd id="receiptDate"></dd></div>
                  <div><dt>时间</dt><dd id="receiptTime"></dd></div>
                  <div><dt>地点</dt><dd id="receiptPlace"></dd></div>
                  <div><dt>天气</dt><dd id="receiptWeather"></dd></div>
                </dl>
                <blockquote id="receiptQuote"></blockquote>
                <div class="receipt-footer"><span>THANK YOU FOR TODAY</span><span>///// // ////</span></div>
              </div>
            </div>
            <span class="paper-guide guide-left"></span><span class="paper-guide guide-right"></span>
            <div class="model-carriage" id="typewriterCarriage">
              <span class="carriage-knob"></span>
              <span class="carriage-rail"></span>
              <span class="carriage-knob"></span>
            </div>
            <span class="return-lever"></span>
            <div class="ribbon-deck"><span class="ribbon-spool"><i></i></span><span class="type-guide"></span><span class="ribbon-spool"><i></i></span></div>
            <div class="model-shell">
              <span class="shell-highlight"></span><span class="keywell"></span>
              <div class="model-brand">TODAY <small>portable no. 1</small></div>
              <div class="model-keyboard" id="modelKeyboard"></div>
              <span class="model-spacebar" id="modelSpacebar"></span>
              <i class="machine-foot foot-left"></i><i class="machine-foot foot-right"></i>
            </div>
          </div>
          <p class="printing-status" id="printingStatus">正在识别照片里的今天</p>
          <div class="result-actions printing-actions" id="printingActions" hidden>
            <p>你今天的小票打印好了。</p>
            <div class="button-row">
              <button class="secondary-button" id="redoButton" type="button">再做一张</button>
              <button class="secondary-button" id="changeQuoteButton" type="button">换一句</button>
              <button class="primary-button" id="downloadButton" type="button">保存小票</button>
            </div>
          </div>
        </section>

        <div class="drop-zone" id="dropZone" hidden>松开照片，开始制作</div>
        <input id="fileInput" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif" hidden />
        <canvas id="exportCanvas" hidden></canvas>
      </section>
    </main>
    <div class="toast" id="toast" role="status" hidden></div>
    <script src="app.js?v=20260814-1"></script>
  </body>
</html>
