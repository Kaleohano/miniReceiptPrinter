<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#c9edf0" />
    <meta name="description" content="把一张照片打印成一份属于今天的电子小票。" />
    <title>Today's Receipt</title>
    <link rel="stylesheet" href="styles.css?v=20260810-14" />
  </head>
  <body>
    <div class="grain" aria-hidden="true"></div>
    <main class="app-shell">
      <header class="topbar">
        <button class="wordmark" id="homeButton" type="button" aria-label="返回首页">
          <span class="wordmark-mark">T</span>
          <span>Today's Receipt</span>
        </button>
        <div class="top-actions">
          <span class="device-label" id="deviceLabel">正在识别设备</span>
          <button class="icon-button" id="soundButton" type="button" aria-label="关闭声音" title="关闭声音">
            <span aria-hidden="true">♪</span>
          </button>
        </div>
      </header>

      <section class="stage" id="stage" aria-live="polite">
        <div class="intro-copy" id="introCopy">
          <p class="eyebrow">PRINT A MEMORY</p>
          <h1>Today's <br />Receipt</h1>
          <p>放进一张照片，留下今天的时间、地点、天气和一句话。</p>
        </div>

        <section class="device-scene mobile-scene" id="mobileScene" hidden>
          <button class="polaroid-wrap" id="polaroidButton" type="button" aria-label="打开宝丽莱相机">
            <span class="polaroid-card">
              <span class="polaroid-face polaroid-front">
                <span class="drawn-camera drawn-camera-front">
                  <span class="drawn-camera-bump"></span><span class="drawn-camera-body"></span>
                  <span class="drawn-flash"></span><span class="drawn-viewfinder"></span>
                  <span class="drawn-lens"><i></i></span><span class="drawn-shutter"></span>
                  <span class="drawn-brand">TODAY</span><span class="drawn-slot"></span>
                </span>
                <span class="camera-caption">轻触相机开始</span>
              </span>
              <span class="polaroid-face polaroid-back">
                <span class="drawn-camera drawn-camera-rear">
                  <span class="drawn-camera-bump"></span><span class="drawn-camera-body"></span>
                  <span class="drawn-rear-screen"><i></i></span><span class="drawn-rear-eye"></span>
                  <span class="drawn-rear-button button-one"></span><span class="drawn-rear-button button-two"></span>
                  <span class="drawn-slot"></span>
                </span>
                <span class="camera-caption">正在打开取景框</span>
              </span>
            </span>
          </button>
        </section>

        <section class="device-scene desktop-scene" id="desktopScene" hidden>
          <div class="typewriter-model hero-typewriter" aria-hidden="true">
            <div class="model-paper"><span>TODAY'S RECEIPT</span><i></i><i></i><i></i><i></i></div>
            <span class="return-lever"></span>
            <div class="model-carriage"><span class="carriage-knob"></span><span class="carriage-rail"></span><span class="carriage-knob"></span></div>
            <div class="ribbon-deck"><span class="ribbon-spool"></span><span class="type-guide"></span><span class="ribbon-spool"></span></div>
            <div class="model-shell"><div class="model-brand">TODAY</div><div class="model-keyboard"></div><span class="model-spacebar"></span><i class="machine-foot foot-left"></i><i class="machine-foot foot-right"></i></div>
          </div>
          <button class="primary-button upload-only-button" id="desktopUploadButton" type="button" aria-label="上传照片" title="上传照片">
            <span class="upload-icon" aria-hidden="true">↑</span>
            <span class="sr-only">上传照片</span>
          </button>
          <p class="support-text">支持 JPG、PNG、WEBP，也可以直接拖到这里</p>
        </section>

        <section class="camera-overlay" id="cameraOverlay" hidden>
          <div class="camera-panel">
            <div class="camera-panel-top">
              <button class="round-control" id="closeCameraButton" type="button" aria-label="关闭相机">×</button>
              <span>后置相机</span>
              <button class="round-control" id="switchCameraButton" type="button" aria-label="切换摄像头">↻</button>
            </div>
            <div class="live-view">
              <video id="cameraVideo" autoplay playsinline muted></video>
              <div class="focus-frame" aria-hidden="true"></div>
              <div class="camera-message" id="cameraMessage" hidden></div>
            </div>
            <div class="camera-panel-bottom">
              <button class="gallery-button" id="mobileUploadButton" type="button">相册</button>
              <button class="shutter" id="shutterButton" type="button" aria-label="拍照"><span></span></button>
              <span class="spacer"></span>
            </div>
          </div>
        </section>

        <section class="preview-panel" id="previewPanel" hidden>
          <div class="preview-photo-wrap">
            <img id="previewImage" alt="待制作的小票照片预览" />
            <span class="preview-tape" aria-hidden="true"></span>
          </div>
          <div class="preview-copy">
            <p class="eyebrow">照片已就位</p>
            <h2>要把这一刻收进小票吗？</h2>
            <p id="photoMeta">正在读取照片信息</p>
            <div class="button-row">
              <button class="secondary-button" id="chooseAgainButton" type="button">重新选择</button>
              <button class="primary-button" id="makeReceiptButton" type="button">开始打印</button>
            </div>
          </div>
        </section>

        <section class="printing-scene" id="printingScene" hidden>
          <div class="typewriter typewriter-model" aria-hidden="true">
            <div class="model-paper receipt-in-typewriter" id="printingPaper">
              <div class="typed-receipt" id="typedReceipt">
                <div class="receipt-head">
                  <span>TODAY'S RECEIPT</span>
                  <small id="receiptNumber">NO. 000000</small>
                </div>
                <div class="receipt-photo"><img id="receiptPhoto" alt="电子小票照片贴纸" /></div>
                <dl class="receipt-info">
                  <div><dt>日期</dt><dd id="receiptDate"></dd></div>
                  <div><dt>时间</dt><dd id="receiptTime"></dd></div>
                  <div><dt>地点</dt><dd id="receiptPlace"></dd></div>
                  <div><dt>天气</dt><dd id="receiptWeather"></dd></div>
                </dl>
                <blockquote id="receiptQuote"></blockquote>
                <div class="receipt-footer"><span>THANK YOU FOR TODAY</span><span>///// // ////</span></div>
              </div>
            </div>
            <div class="model-carriage" id="typewriterCarriage">
              <span class="carriage-knob"></span>
              <span class="carriage-rail"></span>
              <span class="carriage-knob"></span>
            </div>
            <span class="return-lever"></span>
            <div class="ribbon-deck"><span class="ribbon-spool"></span><span class="type-guide"></span><span class="ribbon-spool"></span></div>
            <div class="model-shell">
              <div class="model-brand">TODAY</div>
              <div class="model-keyboard" id="modelKeyboard"></div>
              <span class="model-spacebar" id="modelSpacebar"></span>
              <i class="machine-foot foot-left"></i><i class="machine-foot foot-right"></i>
            </div>
          </div>
          <p class="printing-status" id="printingStatus">正在识别照片里的今天</p>
          <div class="result-actions printing-actions" id="printingActions" hidden>
            <p>你今天的小票打印好了。</p>
            <div class="button-row">
              <button class="secondary-button" id="redoButton" type="button">再做一张</button>
              <button class="secondary-button" id="changeQuoteButton" type="button">换一句</button>
              <button class="primary-button" id="downloadButton" type="button">保存小票</button>
            </div>
          </div>
        </section>

        <div class="drop-zone" id="dropZone" hidden>松开照片，开始制作</div>
        <input id="fileInput" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif" hidden />
        <canvas id="captureCanvas" hidden></canvas>
        <canvas id="exportCanvas" hidden></canvas>
      </section>
    </main>
    <div class="toast" id="toast" role="status" hidden></div>
    <script src="app.js?v=20260810-14"></script>
  </body>
</html>
